# Nginx là cổng vào DUY NHẤT của hệ thống.
# Image nginx-unprivileged chạy bằng user 101 nên chỉ lắng nghe được cổng >1024:
#   8080 -> ánh xạ ra 80   (chỉ chuyển hướng 301 sang HTTPS)
#   8443 -> ánh xạ ra 443  (HTTPS, proxy tới web và phpMyAdmin)
# stub_status bị giới hạn cho dải mạng nội bộ Docker, phục vụ nginx-prometheus-exporter.

log_format sm_main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                'rt=$request_time';

server_tokens off;
client_max_body_size 2m;
client_body_timeout 15s;
client_header_timeout 15s;
# keepalive_timeout đã được khai báo sẵn trong nginx.conf của image (65s)

upstream app_upstream {
    server web:3000;
    keepalive 16;
}

upstream pma_upstream {
    server phpmyadmin:80;
    keepalive 8;
}

# ---------- HTTP: chỉ chuyển hướng sang HTTPS ----------
server {
    listen 8080 default_server;
    server_name _;

    access_log /dev/stdout sm_main;

    return 301 https://$host$request_uri;
}

# ---------- HTTPS ----------
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    # Trả Location dạng tương đối để không lộ cổng nội bộ 8443 ra trình duyệt
    absolute_redirect off;

    access_log /dev/stdout sm_main;
    error_log  /dev/stderr warn;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    # Security headers cho toàn server (app dùng CSS/JS tệp rời, không script nội tuyến)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    # Dùng cho healthcheck của container, không lộ dữ liệu
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Số liệu cho nginx-prometheus-exporter (Giai đoạn 4). Chỉ mạng nội bộ Docker gọi được.
    location = /nginx-status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
    }

    # phpMyAdmin chạy dưới đường dẫn con /pma/ để chỉ mở một cổng 443 duy nhất.
    location = /pma {
        return 301 /pma/;
    }

    location /pma/ {
        proxy_pass http://pma_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_hide_header X-Powered-By;
        # Bỏ CSP do phpMyAdmin tự gửi để chỉ còn một CSP duy nhất do Nginx quản lý
        proxy_hide_header Content-Security-Policy;
        # phpMyAdmin sinh URL tuyệt đối bắt đầu bằng "/" và cookie path "/",
        # nên phải thêm lại tiền tố /pma/ khi trả về trình duyệt.
        proxy_redirect / /pma/;
        proxy_cookie_path / /pma/;
        proxy_read_timeout 60s;

        # phpMyAdmin dùng script/style nội tuyến nên cần CSP riêng, nới lỏng hơn app.
        # Lưu ý: location nào có add_header sẽ KHÔNG kế thừa add_header của server,
        # vì vậy phải khai báo lại đầy đủ các header bảo mật ở đây.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'" always;
    }

    # Ứng dụng quản lý sinh viên
    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
