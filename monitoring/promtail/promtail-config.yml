# Promtail đọc log của mọi container qua Docker API (service discovery),
# gắn nhãn container / service / project rồi đẩy về Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Tên container: /sm-web -> sm-web
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Tên service trong docker-compose.yml: web, db, nginx...
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      # Chỉ lấy log của dự án này, bỏ qua container của bài khác trên máy
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'student-management'
        action: keep
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
